# Plugin, stage and project-editing UX capability manifest — the parity
# contract between `orc-gui` and `orc-cli`.
#
# Every plugin, stage and project-node action a user can take is recorded here
# once, with the command that performs it and the control that performs it. The
# PluginUxCapabilityParity CTest (cmake/check_plugin_ux_parity.sh, label
# "unit;cli") reads this file and fails when either side goes missing, so a
# front end cannot quietly grow or lose a capability the other one has.
#
# Entry fields:
#   id           Stable capability identifier. Never reused for another action.
#   cli          The invocation a user types. `none` when there is no CLI form.
#   cli_group    Which help output owns it: `plugins`, `stages`, `nodes`,
#                `tools`, or `none`.
#   cli_help     Exact substring that must appear in that group's --help text.
#                Required whenever cli_group is not `none`.
#   gui          The control that performs it. `none` when there is no GUI form.
#   gui_evidence Literal that must appear under orc/gui. Pick a string that
#                names the control's construction (a widget member, an object
#                name, a distinctive label literal) so deleting the control
#                removes the evidence; a word that appears all over the GUI
#                proves nothing. Defaults to the `gui` value.
#   reason       Required when either side is `none`: why the asymmetry is
#                intended rather than a gap.
#
# What the gate can and cannot see: it verifies every recorded CLI form against
# the live --help text, and that every subcommand the --help text offers is
# recorded here. A GUI-side addition has no equivalent machine signal, so the
# `gui` field is checked for evidence in the sources but its completeness rests
# on this file being updated with the change — which is what reviewing a diff
# against this manifest is for.

capabilities:
  # --- Installed plugins ----------------------------------------------------

  - id: plugins.list
    cli: orc-cli plugins list
    cli_group: plugins
    cli_help: "list [options]"
    gui: Plugin Manager table
    gui_evidence: "Plugin Manager"

  - id: plugins.list.core
    cli: orc-cli plugins list --core
    cli_group: plugins
    cli_help: "--core, --all"
    gui: Show core plugins
    gui_evidence: "Show core plugins"

  - id: plugins.list.check_updates
    cli: orc-cli plugins list --check-updates
    cli_group: plugins
    cli_help: "--check-updates"
    gui: Update column
    gui_evidence: "COL_UPDATE"

  - id: plugins.details
    cli: orc-cli plugins info <selector>
    cli_group: plugins
    cli_help: "info <selector>"
    gui: Details
    gui_evidence: "pluginDetailsLabel"

  - id: plugins.doctor
    cli: orc-cli plugins doctor
    cli_group: plugins
    cli_help: "doctor"
    gui: Diagnostics
    gui_evidence: "pluginDiagnosticsGroup"

  # --- Registry management --------------------------------------------------

  - id: plugins.add.local
    cli: orc-cli plugins add <path>
    cli_group: plugins
    cli_help: "add <path> [options]"
    gui: Add Plugin...
    gui_evidence: "Add Plugin..."

  - id: plugins.add.url
    cli: orc-cli plugins add --url <releases-url>
    cli_group: plugins
    cli_help: "add --url <releases-url>"
    gui: Add Plugin...
    gui_evidence: "Add Plugin..."

  - id: plugins.remove
    cli: orc-cli plugins remove <selector>
    cli_group: plugins
    cli_help: "remove [--dry-run] <selector>"
    gui: Remove
    gui_evidence: "remove_button_"

  - id: plugins.remove.dry_run
    cli: orc-cli plugins remove --dry-run <selector>
    cli_group: plugins
    cli_help: "--dry-run"
    gui: none
    reason: >-
      Resolving a selector without writing is a scripting affordance; the GUI
      shows the row it would remove before you press the button.

  - id: plugins.enable
    cli: orc-cli plugins enable <selector>
    cli_group: plugins
    cli_help: "enable <selector>"
    gui: Enabled
    gui_evidence: "makePluginRowPresentation"

  - id: plugins.disable
    cli: orc-cli plugins disable <selector>
    cli_group: plugins
    cli_help: "disable <selector>"
    gui: Enabled
    gui_evidence: "makePluginRowPresentation"

  # --- Trust ----------------------------------------------------------------

  - id: plugins.trust.confirmation
    cli: orc-cli plugins add / install / update / enable
    cli_group: plugins
    cli_help: "--yes"
    gui: Plugin Trust
    gui_evidence: "kTrustWarning"

  - id: plugins.trust
    cli: orc-cli plugins trust <selector>
    cli_group: plugins
    cli_help: "trust <selector>"
    gui: Enabled
    gui_evidence: "makePluginRowPresentation"
    reason: >-
      Trust has no control of its own in the GUI by design; ticking Enabled is
      the trust-granting action, so this is that same capability scripted.

  - id: plugins.untrust
    cli: orc-cli plugins untrust <selector>
    cli_group: plugins
    cli_help: "untrust <selector>"
    gui: none
    reason: >-
      Deliberate: the GUI has no standalone trust control to withdraw from.
      Untrusting stays a scriptable primitive.

  # --- Available plugins ----------------------------------------------------

  - id: plugins.search
    cli: orc-cli plugins search [term]
    cli_group: plugins
    cli_help: "search [term] [filters]"
    gui: Browse Plugins...
    gui_evidence: "Browse Plugins"

  - id: plugins.search.filters
    cli: orc-cli plugins search --installed / --available / --compatible
    cli_group: plugins
    cli_help: "--compatible"
    gui: Browse Plugins...
    gui_evidence: "Browse Plugins"

  - id: plugins.install
    cli: orc-cli plugins install <id>
    cli_group: plugins
    cli_help: "install <id>"
    gui: Install…
    gui_evidence: "install_button_"

  # --- Updating -------------------------------------------------------------

  - id: plugins.updates
    cli: orc-cli plugins updates
    cli_group: plugins
    cli_help: "updates"
    gui: Update column
    gui_evidence: "COL_UPDATE"

  - id: plugins.update
    cli: orc-cli plugins update <selector>
    cli_group: plugins
    cli_help: "update <selector> | --all"
    gui: Update
    gui_evidence: "update_button_"

  - id: plugins.update.all
    cli: orc-cli plugins update --all
    cli_group: plugins
    cli_help: "update <selector> | --all"
    gui: none
    reason: >-
      No bulk control in the Plugin Manager; the Update button acts on the
      selected row.

  - id: plugins.restart_prompt
    cli: none
    cli_group: none
    gui: Restart Required
    gui_evidence: "Restart Required"
    reason: >-
      Only a running GUI has a session to restart. The CLI prints the same
      registry-change note instead.

  # --- Stage introspection --------------------------------------------------

  - id: stages.list
    cli: orc-cli stages list
    cli_group: stages
    cli_help: "list [options]"
    gui: Add-stage context menu
    gui_evidence: "stage_category_label"

  - id: stages.list.core
    cli: orc-cli stages list --core
    cli_group: stages
    cli_help: "--core, --all"
    gui: Add-stage context menu
    gui_evidence: "stage_category_label"

  - id: stages.list.kind
    cli: orc-cli stages list --kind KIND
    cli_group: stages
    cli_help: "--kind KIND"
    gui: Add-stage context menu categories
    gui_evidence: "stage_category_label"

  - id: stages.list.plugin
    cli: orc-cli stages list --plugin ID
    cli_group: stages
    cli_help: "--plugin ID"
    gui: Plugins submenu
    gui_evidence: "plugins_menu"

  - id: stages.list.format
    cli: orc-cli stages list --format NTSC|PAL|PAL-M
    cli_group: stages
    cli_help: "--format NTSC|PAL|PAL-M"
    gui: Add-stage context menu
    gui_evidence: "stage_category_label"

  - id: stages.info
    cli: orc-cli stages info <stage>
    cli_group: stages
    cli_help: "info <stage> [options]"
    gui: Edit Parameters...
    gui_evidence: "Edit Parameters..."

  - id: stages.parameters.live_update
    cli: none
    cli_group: none
    gui: Live update
    gui_evidence: "live_update_check"
    reason: >-
      Live update closes the loop between a parameter and the picture it
      changes, which only exists where there is a preview to watch; a CLI run
      reads its parameters once and processes with them.

  - id: stages.info.yaml
    cli: orc-cli stages info <stage> --yaml
    cli_group: stages
    cli_help: "--yaml"
    gui: none
    reason: >-
      A paste-ready project fragment answers a text-editing question; the GUI
      edits the same values in place.

  - id: stages.info.filtergraph
    cli: orc-cli stages info <stage> --filtergraph
    cli_group: stages
    cli_help: "--filtergraph"
    gui: none
    reason: >-
      The filtergraph form exists to be typed on a command line; the GUI has
      the graph editor instead.

  - id: stages.help
    cli: orc-cli stages help <stage>
    cli_group: stages
    cli_help: "help <stage>"
    gui: Help...
    gui_evidence: "StageHelpDialog"

  # --- Project nodes --------------------------------------------------------

  - id: nodes.list
    cli: orc-cli nodes list <project>
    cli_group: nodes
    cli_help: "list <project>"
    gui: DAG editor stage nodes and their status dot
    gui_evidence: "orcModel->getConfigurationStatus"

  - id: nodes.parameters.get
    cli: orc-cli nodes get <project> <node>
    cli_group: nodes
    cli_help: "get <project> <node>"
    gui: Edit Parameters...
    gui_evidence: "edit_params_action"

  - id: nodes.parameters.set
    cli: orc-cli nodes set <project> <node> key=value
    cli_group: nodes
    cli_help: "set <project> <node> key=value"
    gui: Edit Parameters...
    gui_evidence: "edit_params_action"

  - id: nodes.parameters.set.output
    cli: orc-cli nodes set <project> <node> key=value --output <file>
    cli_group: nodes
    cli_help: "--output FILE"
    gui: Save Project As...
    gui_evidence: "Save Project &As..."

  # --- Stage tools ------------------------------------------------------------

  - id: tools.list
    cli: orc-cli tools list <project> [<node>]
    cli_group: tools
    cli_help: "list <project> [<node>]"
    gui: Stage Tools submenu of the stage context menu
    gui_evidence: "Stage Tools"

  - id: tools.run
    cli: orc-cli tools run <project> <tool> --node <node>
    cli_group: tools
    cli_help: "run <project> <tool> --node <node>"
    gui: Run Analysis in the stage tool dialog
    gui_evidence: "Run Analysis"

  - id: tools.run.parameters
    cli: orc-cli tools run ... --param key=value
    cli_group: tools
    cli_help: "--param key=value"
    gui: The stage tool dialog's parameter fields
    gui_evidence: "createParameterWidget"

  - id: tools.run.apply
    cli: orc-cli tools run ... --apply
    cli_group: tools
    cli_help: "--apply"
    gui: Apply to Stage
    gui_evidence: "Apply to Stage"

  - id: tools.run.output
    cli: orc-cli tools run ... --apply --output <file>
    cli_group: tools
    cli_help: "--output FILE"
    gui: Save Project As...
    gui_evidence: "Save Project &As..."

  - id: tools.run.csv
    cli: orc-cli tools run <project> <analysis tool> --node <sink> --csv <file>
    cli_group: tools
    cli_help: "--csv FILE"
    gui: none
    reason: >-
      The GUI's analysis dialogs plot the results; a CSV comes from the sink's
      own Write CSV and CSV Output Path parameters, set with Edit Parameters.
      The CLI flag sets those two for one run without saving them.

  - id: tools.run.cancel
    cli: Ctrl-C during orc-cli tools run
    cli_group: tools
    cli_help: "Ctrl-C asks the tool to stop"
    gui: Cancel in the stage tool dialog
    gui_evidence: "cancelButton_"

  - id: tools.config_dialog
    cli: orc-cli nodes set <project> <node> key=value
    cli_group: nodes
    cli_help: "set <project> <node> key=value"
    gui: Mask Line and export preset dialogs
    gui_evidence: "MaskLineConfigDialog dialog"

  - id: tools.dropout_editor
    cli: none
    cli_group: none
    gui: Dropout Editor
    gui_evidence: "DropoutEditorDialog"
    reason: >-
      Marking dropouts by hand needs a person looking at the picture. A script
      can still copy a finished dropout map between projects with nodes set.

  - id: tools.catalogue
    cli: none
    cli_group: none
    gui: Teletext Pages / NABTS Records catalogue browser
    gui_evidence: "CatalogueDialog"
    reason: >-
      Browsing is interactive. The teletext and NABTS sinks write their files
      when the project is processed with --process, which is the CLI's form.

  - id: tools.vectorscope
    cli: none
    cli_group: none
    gui: Vectorscope
    gui_evidence: "VectorscopeDialog"
    reason: >-
      A preview view: it shows the signal under the preview cursor and has no
      result to report or apply.

  # --- Scripting contract ---------------------------------------------------

  - id: plugins.json
    cli: orc-cli plugins list / search / info / updates / doctor --json
    cli_group: plugins
    cli_help: "--json"
    gui: none
    reason: >-
      Machine-readable output has no meaning in a dialog; the GUI's rendering
      of the same presenter structs is its projection.

  - id: stages.json
    cli: orc-cli stages list / info --json
    cli_group: stages
    cli_help: "--json"
    gui: none
    reason: >-
      As above: the JSON surface is the scripting projection of the structs the
      GUI renders.

  - id: nodes.json
    cli: orc-cli nodes list / get --json
    cli_group: nodes
    cli_help: "--json"
    gui: none
    reason: >-
      As above: a script reads a project's stages and parameters as JSON; the
      GUI shows the same values in the DAG editor and the parameter dialog.

  - id: tools.json
    cli: orc-cli tools list / run --json
    cli_group: tools
    cli_help: "--json"
    gui: none
    reason: >-
      As above: a script reads which tools a stage offers, and a tool run's
      report, as JSON; the GUI shows the same in the Stage Tools menu and the
      stage tool dialog.
