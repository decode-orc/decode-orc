# Plugin ABI history — single source of truth for the host ABI / plugin API
# version log.
#
# The last entry's `abi` value MUST equal orc::kStagePluginHostAbiVersion in
# orc/sdk/include/orc/abi/orc_plugin_abi.h, and its `api` value MUST equal
# orc::kStagePluginApiVersion. The AbiHistorySync CTest (label "sdk") fails
# when the header constants have no matching entry here, and the
# AbiVersionDocsSync CTest fails when the generated "Version history" table in
# docs/technical/plugin-sdk.md is stale relative to this file.
#
# Regenerate the docs table after any edit:
#   tools/gen_abi_history_docs.sh . (splice output between the GENERATED ABI
#   VERSION HISTORY markers in docs/technical/plugin-sdk.md)
#
# Fields per entry:
#   abi      — host_abi_version value (integer).
#   api      — plugin_api_version value at that ABI ("" for the pre-API v1
#              release).
#   cause    — category of the change, one of:
#                descriptor-append   (new appended StagePluginDescriptor field)
#                entrypoint-signature(entrypoint parameter/return change)
#                data-contract-swap  (a boundary type is replaced wholesale)
#                contract-vtable     (a contract interface vtable layout change)
#                contract-removal    (a public SDK contract header/class removed)
#   contracts — SDK contract headers whose layout the change touches (paths as
#               in orc/sdk/sdk_headers.yaml; [] when none).
#   notes    — optional; ABI-neutral contract-header edits made while this entry
#              is current (comment/doc changes, additive non-vtable helpers).
#              Not rendered in the docs table, so it MUST appear before
#              `summary` — gen_abi_history_docs.sh folds everything after
#              `summary:` into the table cell.
#   summary  — one-line prose used as the docs table "Change" cell; always the
#              last field of an entry.
schema: 1
history:
  - abi: 1
    api: ""
    cause: descriptor-append
    contracts: []
    summary: >-
      Initial internal release; `plugin_api_version` not yet in descriptor
  - abi: 2
    api: 1
    cause: descriptor-append
    contracts:
      - orc/abi/orc_plugin_abi.h
    summary: >-
      `plugin_api_version` added to `StagePluginDescriptor`; public SDK headers
      published
  - abi: 3
    api: 1
    cause: entrypoint-signature
    contracts:
      - orc/abi/orc_plugin_abi.h
      - orc/abi/orc_plugin_services.h
    summary: >-
      `OrcPluginServices` table added; `orc_register_stage_plugin` now receives
      `const OrcPluginServices*` as its first parameter; plugins must use the
      services table for logging instead of resolving host symbols directly
  - abi: 4
    api: 2
    cause: data-contract-swap
    contracts:
      - orc/stage/video_frame_representation.h
      - orc/stage/dropout/dropout_run.h
      - orc/stage/frame_id.h
    summary: >-
      Decode-Orc 2.0: `VideoFrameRepresentation` replaces
      `VideoFieldRepresentation` as the primary frame-data contract;
      `DAGStage::execute()` operates on frame-based artifacts; `DropoutRun`
      replaces `DropoutRegion`; `FieldID`/`FieldIDRange` removed — use
      `FrameID`/`FrameIDRange`. All plugins must be rebuilt against the v2.0 SDK
  - abi: 5
    api: 2
    cause: descriptor-append
    contracts:
      - orc/abi/orc_plugin_abi.h
      - orc/abi/orc_plugin_registration.h
    summary: >-
      `StagePluginDescriptor` gains the appended `toolchain_tag` field
      (populate with `ORC_SDK_TOOLCHAIN_TAG`); the loader requires the plugin's
      tag to equal the host's exactly. Registration helpers
      (`ORC_STAGE_PLUGIN_DESCRIPTOR`, `ORC_DEFINE_STAGE_PLUGIN`) added in
      `<orc/abi/orc_plugin_registration.h>`
  - abi: 6
    api: 2
    cause: contract-vtable
    contracts:
      - orc/stage/video_frame_representation.h
    summary: >-
      Multi-track audio: `VideoFrameRepresentation`'s single-track audio
      accessors (`audio_locked()`, `get_audio_sample_count(FrameID)`,
      `get_audio_samples(FrameID)`) are replaced by a track-indexed API —
      `audio_track_count()`, `get_audio_track_descriptor(track)`, per-track
      frame-locked accessors, and per-track free-running stream accessors
      (`get_audio_stream_pair_count` / `get_audio_stream_samples`). New contract
      header `<orc/stage/audio_track.h>`. The vtable layout change requires all
      plugins to be rebuilt
  - abi: 7
    api: 2
    cause: contract-vtable
    contracts:
      - orc/stage/video_frame_representation.h
      - orc/stage/audio/audio_channel_pair.h
    summary: >-
      Channel-pair audio (SMPTE 272M-1994): the track-indexed audio API is
      replaced by the channel-pair API — `audio_channel_pair_count()`,
      `get_audio_channel_pair_descriptor(pair)`, and `get_audio_samples(pair,
      id)` returning 24-bit-in-int32 samples. All audio is 48 kHz frame-locked
      (synchronous); the free-running stream accessors are removed. Contract
      header `<orc/stage/audio_track.h>` is replaced by
      `<orc/stage/audio/audio_channel_pair.h>`. The vtable layout change
      requires all plugins to be rebuilt
  - abi: 8
    api: 2
    cause: contract-vtable
    contracts:
      - orc/stage/video_frame_representation.h
    summary: >-
      `VideoFrameRepresentation` gains `prime_audio_decode()`: a hook that
      forces a deferred whole-stream audio decode (e.g. EFM audio) to run up
      front with progress reporting, forwarded down the wrapper chain so sinks
      can meter it on the progress dialog. The appended virtual changes the
      vtable layout, requiring all plugins to be rebuilt
  - abi: 9
    api: 2
    cause: descriptor-append
    contracts:
      - orc/abi/orc_plugin_services.h
    summary: >-
      `OrcPluginServices` gains the appended `observation_service` pointer
      (`IObservationService`, new contract header
      `<orc/stage/observation/observation_service_interface.h>`): a host-owned
      service that runs the standard observers by stable string id, reached via
      `plugin::get_observation_service()`. Guarded by `services_size`; older
      hosts leave it null. Appended field only — plugins need not be rebuilt to
      keep working against ABI 8 behaviour
  - abi: 10
    api: 2
    cause: contract-removal
    contracts:
      - orc/stage/observation/observer.h
    summary: >-
      The concrete observer classes (the nine
      `<orc/stage/observation/*_observer.h>` headers — `BiphaseObserver`,
      `WhiteSNRObserver`, …) and the `Observer` base
      (`<orc/stage/observation/observer.h>`) are removed from the plugin SDK:
      observers are now host-internal and reached exclusively through the
      `IObservationService` added in ABI 9, selected by stable string id.
      `orc-sdk-support` no longer ships observer object code, and the deprecated
      pre-tier observation include-path shims (`<orc/stage/observers/...>` and
      the flat `<orc/stage/observation_*.h>` paths) are removed.
      `observation_schema.h`, `observation_context*.h`, and
      `observation_service_interface.h` remain the contract. Source-breaking for
      any plugin still including the observer classes — migrate to
      `IObservationService::create_observer(id)`
  - abi: 11
    api: 3
    cause: data-contract-swap
    contracts:
      - orc/stage/frame_descriptor.h
      - orc/stage/common_types.h
      - orc/stage/observation/observation_service_interface.h
      - orc/stage/video_frame_representation.h
    summary: >-
      `FrameDescriptor` drops the `colour_frame_index`, `frame_number`, and
      `timecode` fields. Signal-measured facts are no longer baked in by
      source stages: colour-sequence phase is measured uniformly for TBC and
      CVBS sources via the host `colour_frame_phase` observer, reached through
      the new contract header
      `<orc/stage/observation/colour_frame_phase_query.h>`
      (`orc::observation::measure_frame_phase()` /
      `measure_colour_frame_index()`), and VBI picture numbers / timecodes
      come from the host `biphase` observer's interpreted `vbi.*` keys (the
      dropped `frame_number`/`timecode` fields were never populated by any
      source). The analysis-sink result types in `<orc/stage/common_types.h>`
      also become canonical per-frame records: the aggregated-per-bucket fields
      are removed (`FrameDropoutStats` now carries integer `dropout_count` and
      `dropout_length_samples` in place of the double
      `dropout_count`/`total_dropout_length`; `FrameSNRStats` drops
      `field_count`/`white_snr_count`/`black_psnr_count`; `FrameBurstLevelStats`
      drops `field_count`), each record now representing exactly one analysed
      frame with display bucketing moved to a host-side decimation utility.
      `ObserverInfo` in
      `<orc/stage/observation/observation_service_interface.h>` also gains an
      appended `bool stateless` field classifying whether an observer's
      per-frame result is order-independent (stateless) or models a cross-frame
      stream (stateful, e.g. `closed_caption`, `colour_frame_phase`); it drives
      background-scheduler frame ordering and never changes a per-frame result.
      `VideoFrameRepresentation` in
      `<orc/stage/video_frame_representation.h>` gains an appended virtual
      `video_passthrough_source(FrameID)` (default nullptr) letting a transform
      declare, from metadata alone, that a frame's CVBS video content is
      byte-identical to its upstream input; the host uses it to share
      frame-content-keyed stored observations across stages instead of
      re-analysing identical frames. Layout- and source-breaking for any plugin
      reading the removed fields or these result structs.
  - abi: 12
    api: 4
    cause: data-contract-swap
    contracts:
      - orc/stage/node_type.h
    notes: >-
      ABI-neutral since this entry: `orc/stage/frame_descriptor.h` — the
      `is_padding_frame` doc comment was widened to cover source frames whose
      TBC metadata marks both fields as padding, alongside the synthetic
      gap-fill frames inserted by `frame_map`/`source_align` (issue #77).
      Comment only; no layout or vtable change, no rebuild required.
      Also ABI-neutral: `orc/stage/audio/audio_sample_feed.h` is a new
      stage-tier header, promoted verbatim from the private sink-side
      `orc/plugins/stages/sinks/common/audio_sample_feed.h` so preview
      playback can share the carrier-domain conversions with the encoders and
      WAV writers. Additive and inline-only (`audio_carrier_to_float/_s32/
      _s16`, `audio_apply_gain`, the `kAudioCarrier{Min,Max}` constants): no
      type crosses the plugin boundary, so nothing existing changes layout or
      vtable and no rebuild is required.
    summary: >-
      `NodeTypeInfo` drops the free-text `menu_category` field and the unused
      `SinkCategory` enum/`sink_category` field. The Add Stage menu category is
      no longer plugin-declared: it is derived from the stage's `NodeType` via
      the new `StageCategory` enum and `stage_category_for()` helper (SOURCE →
      Source, TRANSFORM/MERGER/COMPLEX → Transform, ANALYSIS_SINK → Analysis,
      SINK → Sink), so a plugin can never place a stage under an invented
      category. Layout- and source-breaking: the `NodeTypeInfo` constructor
      loses its trailing `SinkCategory` and `menu_category` parameters.
  - abi: 13
    api: 4
    cause: data-contract-swap
    contracts:
      - orc/stage/analysis_sink_results.h
      - orc/stage/tooling/catalogue_results.h
      - orc/plugin/orc_stage_tooling.h
    notes: >-
      Everything in this entry happened while abi 13 was unreleased, so it is
      folded in here rather than spread over three bumps of its own. It began as
      a teletext change: `TeletextCataloguedPage` replaced its single
      `TeletextPageSnapshot page` member with a `std::vector` of a new
      `TeletextCataloguedSubPage` (sub-code, first/last seen frame, times seen,
      page snapshot), because a page number can carry a sequence of sub-pages the
      service cycles through — the multi-page set of ETSI EN 300 706 Annex A.1 —
      and cataloguing one assembly per page number kept only whichever sub-page
      was transmitted last. That change is the reason the entry exists, and it is
      also the argument for the removal the summary records: a sub-page field is
      of no interest to any plugin that is not a teletext decoder, and it should
      never have been able to break one.
      The NABTS record surface (CEA-516 / ITU-R BT.653 System C) was added to
      `orc/stage/analysis_sink_results.h` and to a support-tier
      `<orc/support/nabts_page.h>` earlier in this same unreleased entry —
      `NabtsRecordFunction`, `NabtsCataloguedRecord`, `NabtsRecoverySummary`,
      `NabtsAnalysisDataset`, an `INabtsAnalysisResults` interface,
      `NabtsCaptionCue`, the `nabts_caption_cues()` helper and the decoded
      NAPLPS display list. None of it survived to a release: it went out with
      the teletext types above, into the sink plugins' own
      `vbi-services/vbi_analysis_results.h`, and the two sink stages now hand
      the host a `CatalogueDataset` instead of an interface over their own
      datasets. The net effect of abi 13 on the SDK surface is therefore the
      catalogue contract alone; no released plugin ever saw the NABTS types.
    summary: >-
      Format-specific results contracts out, a generic one in. The new
      `<orc/stage/tooling/catalogue_results.h>` carries `CatalogueDataset` and
      the `ICatalogueResults` interface a stage implements to hand the host a
      browsable set of items with something drawable for each — a character-cell
      grid, a 2D display list, a text document or a table — and `StageToolKind`
      gains `CatalogueBrowser`, appended so the values released plugins encode do
      not move. `<orc/stage/analysis_sink_results.h>` in exchange loses every
      teletext and NABTS type it carried (`TeletextCataloguedPage`,
      `TeletextAnalysisDataset`, `ITeletextAnalysisResults`,
      `NabtsCataloguedRecord`, `NabtsAnalysisDataset`, `INabtsAnalysisResults`,
      `nabts_caption_cues()` and their neighbours), along with its includes of
      the format decoders; it keeps only `IDropoutAnalysisResults`,
      `ISNRAnalysisResults` and `IBurstLevelAnalysisResults`. Those types were
      never generic plugin contract, and while they sat in the ABI-frozen stage
      tier a teletext catalogue change bumped the host ABI for every plugin in
      the ecosystem; they now live privately with their sink plugins. The five
      `orc/support/{teletext_*,nabts_page}.h` decoder headers leave the SDK in
      the same breath. Layout- and source-breaking for anything that included
      that header for the removed types, which nothing outside this repository
      could have done.
  - abi: 14
    api: 4
    cause: data-contract-swap
    contracts:
      - orc/stage/tooling/catalogue_results.h
    notes: >-
      ABI-neutral while abi 13 was current: the `CatalogueCell::flash` and
      `CatalogueDrawOp::blinking` doc comments were rewritten when the catalogue
      views learned to animate the two attributes instead of drawing them
      static. Comments only; the layout change is the `blink_to` member below.
    summary: >-
      `CatalogueDrawOp` gains a `blink_to` colour. A blink process is defined by
      ANSI X3.110 §5.3.2.7.2 over a colour map *entry*, alternating it with a
      blink-to entry the service names (§5.3.2.7.3) — so a blinking figure need
      not appear and disappear, it can twinkle between two colours, and a
      renderer given only `blinking` cannot tell which was meant. The member is
      inserted beside `blinking` rather than appended, so the struct's layout
      moves; it is meaningful only where `blinking` is set and defaults to black,
      which is the ground the C1 BLINK START of §6.2.8.1 blinks to in colour
      modes 0 and 1.
  - abi: 15
    api: 4
    cause: contract-vtable
    contracts:
      - orc/stage/tooling/catalogue_results.h
    notes: >-
      ABI-neutral while abi 15 is current: the comment in
      `orc/stage/cvbs_signal_constants.h` naming the two stages allowed to use
      the ld-decode ×64 scale constants was updated when `ld_sink` was renamed
      `tbc_sink`. Comment only; no constant value or layout changed.
      Also ABI-neutral while abi 15 is current:
      `orc/stage/params/parameter_types.h` gains the
      `orc::kInputNodeIdsParameter` name constant, which documents the reserved
      `input_node_ids` parameter the host fills in with the source node IDs of a
      node's incoming connections. A namespace-scope constant only; no type
      gains, loses or moves a member, and a plugin that ignores the parameter is
      unaffected.
    summary: >-
      `CatalogueDisplayList` gains `display_aspect_height`, `nominal_width`,
      `nominal_height` and `pixel_aligned`. A display list is geometry rather
      than pixels, but a source authored for a receiver of a particular
      resolution has geometry that only resolves against that resolution: ANSI
      X3.110 §5.3.2.2.6 defines the logical pel over "all of those pixels that
      lie under any portion of the logical pel as it is mapped to the display
      screen" and guarantees it "will always map to at least one and possibly
      many display pixels", so a stroke of no stated width is one *pixel* wide.
      A renderer given no resolution can only fall back on a device pixel, which
      makes stroke width depend on how large the list happens to be drawn.
      `nominal_width` and `nominal_height` state the grid; both default to 0,
      which is the previous behaviour. `display_aspect_height` separates the
      shape the drawable area is drawn at from `aspect_height`, which keeps its
      meaning as the extent of unit y the list covers — the two differ wherever
      the authoring receiver's pixels were not square, as §4.2.2's 4:3 display
      area over a 256 by 200 grid makes them. It defaults to 0, meaning square
      pixels and so the previous shape. `pixel_aligned` says the operations tile
      that grid — one per pixel of it, or per run of pixels along a row — rather
      than describing shapes drawn on it, which is a different thing to draw:
      the edges are the source's own pixels rather than an artefact of drawing
      them, so a renderer lays them down hard and aligned to whole device
      pixels. Smoothing them blurs pixels a receiver had sharp, and antialiasing
      both sides of the boundary where two runs abut leaves a seam along a join
      that should be invisible; it defaults to false, which is the previous
      behaviour for every list that does not say otherwise. The four members are
      appended, so no existing member moves, but the struct grows and
      `CatalogueDisplayList` is embedded by value in `CataloguePayload`;
      layout-breaking for anything built against abi 14. `CatalogueSchema` gains
      `view_label`, `view_options` and `view_option`, and `ICatalogueResults`
      gains a virtual `catalogue(view_option)`, so a stage can offer the reader
      several ways of presenting the same items and be re-asked for the one
      picked. Which receiver a page is resolved against is exactly such a
      property — it changes nothing the decode found and everything about how it
      looks — and carrying it only as a stage parameter puts it where changing
      it rebuilds the graph and discards the results being looked at. The new
      virtual has a default that ignores the option and returns `catalogue()`,
      so a stage offering none needs no change, but it takes a vtable slot: the
      interface's layout moves and every plugin implementing it must be rebuilt.
      `CatalogueSchema` further gains `toggles`, and `ICatalogueResults` a
      virtual `catalogue(view_option, active_toggles)`, so a browser can offer
      presentation choices that are on or off as well as the several it chooses
      between. The two are separate controls because they are independent axes:
      folding a two-state choice into the view dropdown multiplies the options
      out rather than adding to them, and every further such choice doubles the
      list again. The new `CatalogueViewToggle` carries the state the catalogue
      was built under, so the host shows what it is looking at without
      remembering what it asked for, and a stage offering no toggles leaves the
      browser exactly as it was. This virtual likewise defaults to forwarding to
      `catalogue(view_option)` and likewise takes a vtable slot.
  - abi: 16
    api: 4
    cause: data-contract-swap
    contracts:
      - orc/stage/preview/orc_vectorscope.h
      - orc/stage/preview/orc_preview_types.h
    notes: >-
      ABI-neutral while abi 16 is current: the comments on
      `orc/stage/preview/orc_preview_types.h` and
      `orc/stage/preview/orc_vectorscope.h` were corrected when the two
      acquisitions were brought to parity. `vectorscope_active_area_only`,
      `vectorscope_first_line` and `vectorscope_last_line` describe the line
      select for both acquisitions rather than for `CompositeCarrier` alone,
      and `UVSample::line_number` and `VectorscopeData::first_line`/`last_line`
      are stated as interlaced frame-line indices — line 0 the top line of the
      frame, consecutive numbers alternating fields — so a line number means
      the same thing whichever acquisition produced it. Comments only; no
      member changes type, size or position.


      Also ABI-neutral while abi 16 is current:
      `orc/stage/video_frame_representation.h` gained the EFM t-value packing
      helpers `efm_tvalue()`, `efm_doubt()` and `efm_pack()` with their
      `kEfmTValueMask`/`kEfmDoubtShift`/`kEfmDoubtMax` constants, and the
      comments on `get_efm_samples()`/`get_efm_sample_count()` were rewritten
      to state the CVBS v1.6.1 encoding: each byte carries a t-value in its low
      nibble and the producer's doubt about it in the high nibble. Free inline
      functions and comments only — no member or virtual changes type, size or
      position, and the vtable is untouched. The byte encoding is a semantic
      change rather than a binary one, and is deliberately recorded here
      instead of as a bump: doubt 0 packs to the plain t-value, so a producer
      with nothing to doubt emits the same raw t-value stream an abi 16 plugin
      already expects, and existing captures read back unchanged. Consumers
      must extract the t-value with `efm_tvalue()` rather than range-checking
      the raw byte.
    summary: >-
      The vectorscope contract grows a second acquisition mode. `UVSample`
      carried a field index and nothing else, which is all a grading scope
      needs because the decoder has already thrown away everything a
      measurement scope reads: a composite acquisition plots the burst as well
      as the picture and does not undo the PAL V-switch, so a sample is only
      interpretable alongside which part of the line it came from, which line
      that was, and — ITU-R BT.470-6 Table 2 item 2.16 — the V-switch state of
      that line. `UVSample` therefore gains `sample_class`, `line_phase`,
      `reserved` and `line_number`; the struct grows and every sample of a
      `VectorscopeData` moves. `VectorscopeData` gains `acquisition_mode`,
      `sample_window`, `first_line`, `last_line`, `sample_stride` and an
      embedded `VectorscopeMeasurements` so the renderer can pick the right
      graticule and show burst readouts, and `VectorscopeData` is embedded by
      value in `ColourFrameCarrier`, so that carrier's layout moves too. The
      new `VectorscopeAcquisitionMode`, `VectorscopeSampleClass`,
      `VectorscopeLinePhase` and `VectorscopeSampleWindow` enums are the
      vocabulary those members are stated in. `PreviewCoordinate` gains
      `vectorscope_window`, `vectorscope_first_line` and
      `vectorscope_last_line`: a composite scope's line-select is part of the
      request, not of the stage's configuration, and putting it in the shared
      coordinate keeps it out of the graph. Which of the two acquisitions runs
      is deliberately *not* among them — a colour-domain data type has decoder
      planes to plot and a signal-domain one has a carrier to demodulate, so
      the type already settles it and a second, independently settable mode
      could only disagree with it. The three members are appended, so no
      existing member moves, but the struct grows.
