# Decode-Orc curated plugin index.
#
# The host reads this file from the default-branch head over plain HTTPS, so a
# merged change publishes immediately with no release. Add your plugin by
# opening a pull request that appends an entry under `plugins:`; the PR
# validation workflow checks schema, license and (online) that the repository
# publishes a release with a conforming plugin asset. See README.md for the
# full schema and rules.
#
# The index curates WHICH plugins are offered, not their versions: the host
# resolves each plugin's latest published GitHub release at browse and
# install time, so new upstream releases are available immediately without a
# registry change.
#
# Schema documented in docs/technical/plugin-architecture.md
# ("Curated plugin index").
registry_schema: 2
plugins:
  # Place source plugins below:
  # Place transform plugins below:
  # Place sink plugins below:
  - id: org.decodeorc.stage.hvd_chroma_decoder
    display_name: HVD Chroma decoder
    description: Holographic chroma decoder without comb filter
    maintainer: vrunk11
    license_spdx: GPL-3.0-or-later
    source_repo_url: https://github.com/vrunk11/hvd-cvbs-decoding
    tags: [sink, chroma-decoder, ntsc]
  - id: org.decodeorc.stage.teletext
    display_name: Teletext and NABTS
    description: Teletext and NABTS sinks that recover teletext from the VBI, export the packet stream and browse the pages.
    maintainer: Simon Inns
    license_spdx: GPL-3.0-or-later
    source_repo_url: https://github.com/decode-orc/orc-plugin_teletext
    tags: [sink, teletext, nabts, vbi]
  # Always leave this skeleton example at the bottom of the list
  - id: org.decodeorc.stage.skeleton_passthrough
    display_name: Skeleton Passthrough
    description: Minimal external plugin stage that forwards one input artifact (development example).
    maintainer: Simon Inns
    license_spdx: GPL-3.0-or-later
    source_repo_url: https://github.com/decode-orc/orc-plugin_skeleton
    tags: [transform, example]
