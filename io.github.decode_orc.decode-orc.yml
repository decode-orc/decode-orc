app-id: io.github.decode_orc.decode-orc
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: orc-gui
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # Home access covers typical capture/decode file locations; broader host
  # access is a Flathub-rejectable permission. Prefer portals longer-term.
  - --filesystem=home
  # Quick Project must open sibling files next to the selected one
  # (.tbc.db/.tbc.json metadata, .tbcy/.tbcc pairs). The file-chooser portal
  # only grants the single picked file, so the mount point itself must be
  # readable. TBC captures are large and commonly live on external or
  # secondary drives mounted under these paths.
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  # GVFS FUSE mounts (GNOME file-manager smb://, sftp://, etc.) so network
  # shares browsed via Nautilus are visible. KDE's kio-fuse uses a randomized
  # runtime path that cannot be granted statically; KDE users should use a
  # kernel cifs mount instead.
  - --filesystem=xdg-run/gvfs

modules:
  - name: nasm
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.nasm.us/pub/nasm/releasebuilds/2.16.01/nasm-2.16.01.tar.xz
        sha256: c77745f4802375efeee2ec5c0ad6b7f037ea9c87c92b149a9637ff099f162558

  - name: x264
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d

  - name: x265
    buildsystem: cmake-ninja
    builddir: true
    subdir: source
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_SHARED=ON
      - -DENABLE_CLI=OFF
    sources:
      - type: archive
        url: https://bitbucket.org/multicoreware/x265_git/downloads/x265_3.5.tar.gz
        sha256: e70a3335cacacbba0b3a20ec6fecd6783932288ebc8163ad74bcc9606477cae8

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gpl
      - --enable-libx264
      - --enable-libx265
      - --disable-doc
      # Keep the ffmpeg CLI: the GUI runs "ffmpeg -encoders" to validate
      # export presets (ffmpegpresetdialog). ffplay/ffprobe are not needed.
      - --disable-ffplay
      - --disable-ffprobe
      - --enable-pic
      - --disable-vulkan
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-6.1.1.tar.xz
        sha256: 8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968

  - name: libpng
    buildsystem: autotools
    config-opts:
      - --disable-shared
      - --enable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/libpng/libpng-1.6.40.tar.xz
        sha256: 535b479b2467ff231a3ec6d92a525906fb8ef27978be4f66dbe05d3f3a01b3a1

  - name: sqlite
    buildsystem: autotools
    config-opts:
      - --enable-threadsafe
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://www.sqlite.org/2024/sqlite-autoconf-3450100.tar.gz
        sha256: cd9c27841b7a5932c9897651e20b86c701dd740556989b01ca596fcfa3d49a0a

  - name: fmt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DFMT_DOC=OFF
      - -DFMT_TEST=OFF
      - -DFMT_INSTALL=ON
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    sources:
      - type: archive
        url: https://github.com/fmtlib/fmt/archive/refs/tags/10.2.1.tar.gz
        sha256: 1250e4cc58bf06ee631567523f48848dc4596133e163f02615c97f78bab6c811

  - name: spdlog
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DSPDLOG_BUILD_SHARED=OFF
      - -DSPDLOG_BUILD_EXAMPLE=OFF
      - -DSPDLOG_BUILD_TESTS=OFF
      - -DSPDLOG_FMT_EXTERNAL=ON
    sources:
      - type: archive
        url: https://github.com/gabime/spdlog/archive/refs/tags/v1.14.1.tar.gz
        sha256: 1586508029a7d0670dfcb2d97575dcdc242d3868a259742b69f100801ab4e16b

  - name: yaml-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DYAML_BUILD_SHARED_LIBS=OFF
      - -DYAML_CPP_BUILD_TESTS=OFF
      - -DYAML_CPP_BUILD_TOOLS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    sources:
      - type: archive
        url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz
        sha256: fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16

  - name: fftw
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-threads
      - --enable-sse2
      - --enable-avx
    sources:
      - type: archive
        url: https://www.fftw.org/fftw-3.3.10.tar.gz
        sha256: 56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467

  - name: soxr
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTS=OFF
      - -DWITH_OPENMP=OFF
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/soxr/soxr-0.1.3-Source.tar.xz
        sha256: b111c15fdc8c029989330ff559184198c161100a59312f5dc19ddeb9b5a15889

  - name: qtnodes
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_QT6=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_SHARED_LIBS=OFF
    sources:
      - type: git
        url: https://github.com/paceholder/nodeeditor
        # Keep in sync with the qtnodes input in flake.nix
        commit: 1b173f885b52e4fd9616f663ea288435ccf1d0d8

  - name: ezpwd-reed-solomon
    buildsystem: simple
    build-commands:
      - cp -a c++/ezpwd /app/include/
    sources:
      - type: git
        url: https://github.com/pjkundert/ezpwd-reed-solomon
        commit: 62a490c13f6e057fbf2dc6777fde234c7a19098e

  - name: decode-orc
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_UNIT_TESTS=OFF
      - -DBUILD_GUI_TESTS=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_DOCS=OFF
      - -DEZPWD_INCLUDE_DIR=/app/include
    sources:
      - type: dir
        path: .
