name: Build and Test (Nix)

on:
  workflow_call:

# Three independent jobs run concurrently rather than one serial 48-minute step.
#
#   static-gates   configure-only source scans; finishes in ~3 minutes, so a
#                  formatting or architecture slip fails while the build is
#                  still compiling instead of 40 minutes later
#   noshims-build  a second build tree that shares nothing with the first
#   unit-gate      the long pole: build, tests, installed-package validation
#
# Nothing is duplicated by the split: static-gates never builds, and the
# no-shims tree was already a separate configure inside the old serial step.
jobs:
  # ---------------------------------------------------------------------------
  # Architecture, SDK and format hard gates.
  #
  # Every test behind these three labels is a script that scans the source tree
  # (cmake/check_*.sh) or a clang-format --dry-run, so a configured build tree is
  # enough -- nothing here needs a compiled object. Configuring with the test
  # trees off keeps it to ~20s of cmake plus ~15s of ctest.
  # ---------------------------------------------------------------------------
  static-gates:
    name: Architecture + SDK + Format Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Configure and Run Gates
        run: |
          nix develop .#ci -c bash -lc "
            set -euo pipefail

            cmake -S . -B build-gates \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_UNIT_TESTS=OFF \
              -DBUILD_GUI_TESTS=OFF \
              -DBUILD_INTEGRATION_TESTS=OFF \
              -DBUILD_FUNCTIONAL_TESTS=OFF

            ctest --test-dir build-gates -L mvp --output-on-failure --output-junit \${PWD}/build-gates/ctest-results-mvp.xml
            ctest --test-dir build-gates -L sdk --output-on-failure --output-junit \${PWD}/build-gates/ctest-results-sdk.xml
            ctest --test-dir build-gates -L format --output-on-failure --output-junit \${PWD}/build-gates/ctest-results-format.xml
          "

      - name: Upload Static Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-artifacts-static-gates
          if-no-files-found: warn
          path: |
            build-gates/ctest-results-mvp.xml
            build-gates/ctest-results-sdk.xml
            build-gates/ctest-results-format.xml

  # ---------------------------------------------------------------------------
  # Tiered-SDK validation (deprecated pre-tier shims disabled).
  #
  # A build with ORC_SDK_DEPRECATED_INCLUDE_SHIMS=OFF proves no bundled plugin
  # compiles through a deprecation shim: every pre-tier include path becomes a
  # hard #error for SDK-linked targets. The unit-gate build keeps shims ON (the
  # shipped default the installed package exports for third-party source
  # compatibility), so this tree shares no object with it and gets its own job.
  # ---------------------------------------------------------------------------
  noshims-build:
    name: Tiered-SDK Plugin Build (shims off)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      # Separate cache key from unit-gate: the two jobs compile the same sources
      # with different preprocessor state, so they would evict each other's
      # entries if they shared one.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-noshims-${{ github.sha }}
          restore-keys: |
            ccache-noshims-

      - name: Build Bundled Plugins Without Shims
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
        run: |
          nix develop .#ci -c bash -lc "
            set -euo pipefail

            export CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ccache --zero-stats > /dev/null

            BUILD_JOBS=\"\$(nproc)\"
            if [ -z \"\$BUILD_JOBS\" ] || [ \"\$BUILD_JOBS\" -lt 2 ]; then
              BUILD_JOBS=2
            fi

            cmake -S . -B build-noshims \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_UNIT_TESTS=OFF \
              -DBUILD_GUI=OFF \
              -DORC_SDK_DEPRECATED_INCLUDE_SHIMS=OFF
            cmake --build build-noshims --target orc-stage-plugins --parallel \"\$BUILD_JOBS\"
            echo 'Bundled plugins build clean with pre-tier shims disabled'

            ccache --show-stats
          "

  # ---------------------------------------------------------------------------
  # The long pole: full Debug build with GUI tests, the test suites that need
  # compiled binaries, and the installed-package / SDK-tarball validation that
  # consumes this job's install tree.
  # ---------------------------------------------------------------------------
  unit-gate:
    name: Unit + Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the ABI bump-procedure guard can diff contract
          # headers against origin/main, and so git describe can version the
          # SDK tarball.
          fetch-depth: 0

      # Pure-bash guard (no build): fails when the ABI/API header constants,
      # abi_history.yaml, and the generated docs table drift, or when a contract
      # header changed without an acknowledged history edit. Kept in this job
      # rather than moved to static-gates because it costs nothing and failing
      # here stops the expensive build immediately.
      - name: ABI bump procedure guard
        run: bash tools/check_abi_bump.sh .

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      # Object cache for the compile step. Every run configures from scratch, so
      # without this the whole tree is recompiled each time; with it, a branch
      # push recompiles only the translation units it actually touched. The key
      # is per-commit so the entry is always written back, and restore-keys
      # falls back to the newest earlier cache of this job.
      #
      # Note this caches compilation only: CMAKE_CXX_CLANG_TIDY is a separate
      # command that CMake runs alongside the compiler, so the host tree still
      # pays for its per-file analysis on a cache hit.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-unit-gate-${{ github.sha }}
          restore-keys: |
            ccache-unit-gate-

      # All work runs inside a single nix develop shell to avoid paying the
      # per-step flake evaluation overhead (was 4 separate nix develop calls).
      # The .#ci shell keeps CI tooling streamlined.
      - name: Build, Test and Validate
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          # A repository only gets 10 GB across all its cache keys, shared with
          # the noshims job and the packaging workflows, so cap this well inside
          # that.
          CCACHE_MAXSIZE: 2G
        run: |
          nix develop .#ci -c bash -lc "
            set -euo pipefail

            # Route every compile through the cache restored above. Exporting it
            # rather than passing -D means all three cmake configures below pick
            # it up, including the out-of-tree fixture plugin builds.
            export CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ccache --zero-stats > /dev/null

            BUILD_JOBS=\"\$(nproc)\"
            if [ -z \"\$BUILD_JOBS\" ] || [ \"\$BUILD_JOBS\" -lt 2 ]; then
              BUILD_JOBS=2
            fi

            # --- Configure ---
            # GUI tests are built only in this job. The generator comes from the
            # .#ci shell (Ninja); mold is on its PATH, so the root CMakeLists
            # selects it as the linker.
            #
            # This used to pass -DCMAKE_JOB_POOLS='link=2' to cap simultaneous
            # linkers against OOM on what the comment called a 2-vCPU/7-GB
            # runner. Job pools are Ninja-only and the shell set no generator,
            # so the cap never actually applied; ubuntu-latest is now 4-vCPU and
            # 16 GB, and mold peaks in the tens of MB linking the largest (138
            # MB) test binary. Measured at -j4 on a warm cache, reinstating the
            # cap costs 59% (41s -> 65s) because the link phase serialises, so
            # the build runs unpooled.
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_UNIT_TESTS=ON \
              -DBUILD_GUI_TESTS=ON \
              -DBUILD_INTEGRATION_TESTS=OFF \
              -DBUILD_FUNCTIONAL_TESTS=ON

            # --- Build ---
            cmake --build build --parallel \"\$BUILD_JOBS\"

            # --- Assert fine-grained CTest labels are present ---
            # mvp/sdk/format are asserted here even though the static-gates job
            # runs them: this build tree must still register them, or a label
            # rename would silently empty that job.
            labels_output=\"\$(ctest --test-dir build --print-labels)\"
            expected_labels=(unit gui sources transforms sinks contracts preview gui-logic gui-model gui-widget mvp sdk functional format)
            missing=()
            for label in \"\${expected_labels[@]}\"; do
              if ! printf '%s\n' \"\$labels_output\" | grep -Eq \"^[[:space:]]+\$label\$\"; then
                missing+=(\"\$label\")
              fi
            done
            if [ \"\${#missing[@]}\" -ne 0 ]; then
              echo \"Missing expected CTest labels: \${missing[*]}\"
              echo \"Full ctest --print-labels output:\"
              printf '%s\n' \"\$labels_output\"
              exit 1
            fi
            echo 'All expected fine-grained labels are present'

            # --- Run unit tests ---
            QT_QPA_PLATFORM=offscreen ctest --test-dir build -L unit --parallel \"\$BUILD_JOBS\" --output-on-failure --output-junit \${PWD}/build/ctest-results-unit.xml

            # --- Functional tests (filesystem / plugin-loading contracts) ---
            ctest --test-dir build -L functional --parallel \"\$BUILD_JOBS\" --output-on-failure --output-junit \${PWD}/build/ctest-results-functional.xml

            # --- Installed-package validation (out-of-tree plugin SDK) ---
            # Install to a scratch prefix, build the fixture plugin against the
            # exported decode-orc-plugin-sdk package exactly as a third-party
            # author would, load it into the installed orc-cli, and run the
            # installed enforcement gates against the fixture tree.
            cmake --install build --prefix \"\$PWD/build/sdk-prefix\" > build/install-sdk-prefix.log
            cmake -S orc-tests/fixtures/external-stage-plugin -B build/external-plugin \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH=\"\$PWD/build/sdk-prefix\"
            cmake --build build/external-plugin --parallel \"\$BUILD_JOBS\"
            ORC_STAGE_PLUGIN_PATHS=\"\$PWD/build/external-plugin/lib/orc-stage-plugins\" \
              ./build/sdk-prefix/bin/orc-cli plugins list \
              | grep -F 'decode-orc.fixture.external_passthrough' \
              || { echo 'Fixture plugin did not load into installed orc-cli'; exit 1; }
            bash build/sdk-prefix/lib/cmake/decode-orc-plugin-sdk/check_plugin_private_includes.sh orc-tests/fixtures/external-stage-plugin
            bash build/sdk-prefix/lib/cmake/decode-orc-plugin-sdk/check_plugin_private_links.sh orc-tests/fixtures/external-stage-plugin
            echo 'Installed-package validation passed'

            # --- Standalone SDK package (tarball) validation ---
            # Assemble the versioned, host-free SDK package from the install
            # tree (headers + orc-sdk-support static archive + orc-view-support
            # shared library + CMake config + enforcement scripts + allowlist)
            # and build the fixture plugin against the UNPACKED TARBALL. This proves a third party needs only
            # the SDK package and its two light dependencies (spdlog + fmt) —
            # never the host or its FFmpeg / yaml-cpp / PNG / SQLite3 stack.
            SDK_VERSION=\"\$(git describe --tags --always --dirty 2>/dev/null || echo dev)\"
            SDK_PKG=\"decode-orc-plugin-sdk-\${SDK_VERSION}-linux-x86_64\"
            SDK_STAGE=\"\$PWD/build/sdk-pkg/\${SDK_PKG}\"
            rm -rf \"\$PWD/build/sdk-pkg\"
            mkdir -p \"\${SDK_STAGE}/include\" \"\${SDK_STAGE}/lib/cmake\"
            cp -a build/sdk-prefix/include/decode-orc-plugin-sdk \"\${SDK_STAGE}/include/\"
            cp -a build/sdk-prefix/lib/liborc-sdk-support.a \"\${SDK_STAGE}/lib/\"
            # The view-tier widgets library: the package carries its CMake
            # targets, so it must carry the library they import.
            cp -a build/sdk-prefix/lib/liborc-view-support.so* \"\${SDK_STAGE}/lib/\"
            cp -a build/sdk-prefix/lib/cmake/decode-orc-plugin-sdk \"\${SDK_STAGE}/lib/cmake/\"
            tar -C \"\$PWD/build/sdk-pkg\" -czf \"\$PWD/build/\${SDK_PKG}.tar.gz\" \"\${SDK_PKG}\"
            echo \"Packaged \${SDK_PKG}.tar.gz\"
            # Build the fixture from a freshly UNPACKED copy of the tarball
            # (not the source tree, not the full install prefix).
            rm -rf \"\$PWD/build/sdk-unpack\"; mkdir -p \"\$PWD/build/sdk-unpack\"
            tar -C \"\$PWD/build/sdk-unpack\" -xzf \"\$PWD/build/\${SDK_PKG}.tar.gz\"
            cmake -S orc-tests/fixtures/external-stage-plugin -B build/external-plugin-pkg \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH=\"\$PWD/build/sdk-unpack/\${SDK_PKG}\"
            cmake --build build/external-plugin-pkg --parallel \"\$BUILD_JOBS\"
            echo 'Standalone SDK package validation passed'

            # --- CTest timing summary ---
            python3 cmake/summarize_ctest_junit.py --input build/ctest-results-unit.xml --output build/ctest-results-unit-summary.md --top 25

            # --- Enforce performance budget ---
            # These are safety nets for a pathology — a test that hangs, or a
            # change that serialises the suite — not a target to be re-tuned as
            # the suite grows.
            #
            # Wall time is proportional to suite size on a fixed-core runner
            # (one process per test case, ~0.07s of spawn overhead each), so a
            # snug ceiling fails on healthy growth rather than on a regression:
            # 4385 tests land at 113-146s on a 4-vCPU runner and 5494 at 193s,
            # against the 1680 tests at ~36s this budget was originally written
            # for. A hung test runs to ctest's 1500s default timeout, so 360s
            # still catches a hang while leaving room for the suite to grow and
            # for the run-to-run variance of a shared runner (25% on main).
            #
            # p95 is the gate that does the real work: it is independent of
            # suite size, so it stays meaningful without maintenance. At 0.25s
            # (current value 0.0745s) it matches the slow-gate budgets and trips
            # on an individual test turning slow, not on more tests existing.
            #
            # The pass rate cannot actually fire — the ctest runs above exit
            # non-zero on any failure under 'set -e', so this script only ever
            # runs on a green suite. It is kept as a belt-and-braces record.
            python3 cmake/check_ctest_budget.py \
              --input build/ctest-results-unit.xml \
              --max-wall-seconds 360.0 \
              --min-pass-rate 99.0 \
              --max-p95-seconds 0.250

            # --- Compile cache effectiveness ---
            # A branch push that touched a handful of files should show a hit
            # rate in the high nineties; a run-wide miss means the cache key or
            # the compiler identity moved.
            ccache --show-stats
          "

      - name: Upload Unit Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-artifacts-unit
          if-no-files-found: warn
          path: |
            build/ctest-results-unit.xml
            build/ctest-results-functional.xml
            build/ctest-results-unit-summary.md
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/CTestCostData.txt

      # Standalone plugin-SDK package (headers + orc-sdk-support static lib +
      # orc-view-support shared lib + CMake config + enforcement scripts). Third-party plugin authors consume
      # this instead of the host source tree; the release workflow can attach it
      # to host releases (release-from-artifact.yml, artifact_pattern glob).
      - name: Upload Plugin SDK Package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decode-orc-plugin-sdk
          if-no-files-found: warn
          path: build/decode-orc-plugin-sdk-*-linux-x86_64.tar.gz
