# NTSC held still for the videosynth suite
#
# One still (75 % bars) held for twelve frames with capture noise: three
# whole colour-frame sequences on PAL and PAL-M, six on NTSC, so each frame
# has at least two copies in the same subcarrier phase for the stacker's
# still-frame stacking to use.
# orc-tests/videosynth/stacker/stacker_truth_test.cpp stacks it;
# projects/variants.json derives the truth.

project:
  name: NtscHeldStill
  version: "1.0"
  description: NTSC held still - 12 frames of 75 % bars with noise

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED
  ntsc_laserdisc_vbi_burst: true

output:
  video_path: "{output}/videosynth_ntsc_held_still.cvbs"

line_injections:
  disc_type: CAV
  # IEC 60857 §9.1.3: NTSC and PAL-M LaserDiscs carry VIRS for colour.
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:
  - name: Still
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 12
    section_type: programme_area
    noise:
      noise_db: 40.0
      noise_seed: 8301
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1
