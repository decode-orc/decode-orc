# NTSC dropout concealment case for the videosynth suite
#
# Dropout Correct's two methods, line_copy and interpolate, on pictures with
# vertical detail, where the line a dropout is filled from matters: SMPTE bars
# (bands that change down the picture), the tartan (lines one row high, in
# colour) and the moving zone plate. Three sections of four frames (a colour
# sequence each), every one with random dropouts and scratches, all flagged.
# No noise, so every sample that differs from the truth is a dropout's.
# orc-tests/videosynth/dropout_correct/dropout_correct_truth_test.cpp measures
# each section; the section layout there must match this file.
# projects/variants.json derives the truth and the Y/C renderings.

project:
  name: NtscConceal
  version: "1.0"
  description: NTSC dropout concealment case - stills with vertical detail, motion

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_ntsc_conceal.cvbs"

line_injections:
  # IEC 60857 §9.1.3: NTSC and PAL-M LaserDiscs carry VIRS for colour.
  vits:
    - vits_type: virs
      target_lines: [19, 282]

laserdisc:
  disc_type: CAV
  vbi_burst: true

sections:
  - name: SmpteBars
    type: progressive
    source: "{bundled}/exr/720x486/SMPTE_BARS_001.exr"
    duration_frames: 4
    laserdisc:
      area: programme_area
      codes:
        - code_type: picture_number
          start_value: 1
    dropouts:
      random:
        scale: 10
        seed: 7101
      scratch:
        scale: 8
        seed: 7102

  - name: Tartan
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 4
    laserdisc:
      area: programme_area
      codes:
        - code_type: picture_number
          start_value: 5
    dropouts:
      random:
        scale: 10
        seed: 7103
      scratch:
        scale: 8
        seed: 7104

  - name: Motion
    type: progressive
    source: "{bundled}/mkv/720x486/MOVING_ZONE_2H.mkv"
    start_frame: 40
    duration_frames: 4
    laserdisc:
      area: programme_area
      codes:
        - code_type: picture_number
          start_value: 9
    dropouts:
      random:
        scale: 10
        seed: 7105
      scratch:
        scale: 8
        seed: 7106
