# PAL CLV source case for the videosynth suite
#
# 27 frames of a CLV disc: programme time code 0:00 and the CLV picture
# number, which counts 25 frames a second, so the case crosses one second
# boundary. VITS is the laserdisc set, whose uk-national on lines 19 and 332
# carries the white bar White SNR reads.
# orc-tests/videosynth/sources/sources_test.cpp checks the time codes and the
# VITS; projects/variants.json derives its Y/C rendering.

project:
  name: PalClv
  version: "1.0"
  description: PAL CLV source case - 27 frames, time code 0:00, VITS

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_pal_clv.cvbs"

line_injections:
  disc_type: CLV
  placement: laserdisc
  vits:
    - vits_type: uk-national
      target_lines: [19, 332]
    - vits_type: vits20
      target_lines: [20, 333]

sections:
  - name: Bars
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 27
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: programme_time_code
          - code_type: clv_picture_number
          - code_type: clv_code
