# NTSC noise case for the videosynth suite
#
# Three sections of four frames (a colour-field sequence each) at noise_db
# 38, 44 and 50 with noise_spread_db 3, so Black PSNR should read 38, 44 and
# 50 dB and White SNR 35, 41 and 47 dB. White noise, flat in frequency.
# VITS is the laserdisc set, whose ntc7-composite on line 20 carries the
# white bar White SNR reads.
# orc-tests/videosynth/sources/sources_test.cpp measures both against these
# levels; the section layout there must match this file.

project:
  name: NtscNoise
  version: "1.0"
  description: NTSC noise case - noise_db 38/44/50, spread 3 dB

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED
  ntsc_laserdisc_vbi_burst: true

output:
  video_path: "{output}/videosynth_ntsc_noise.cvbs"

line_injections:
  disc_type: CAV
  placement: laserdisc
  vits:
    - vits_type: virs
      target_lines: [19, 282]
    - vits_type: ntc7-composite
      target_lines: [20]
    - vits_type: ntc7-combination
      target_lines: [283]

sections:
  - name: Noise38
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 4
    section_type: programme_area
    noise:
      noise_db: 38.0
      noise_spread_db: 3.0
      noise_seed: 1038
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1

  - name: Noise44
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 4
    section_type: programme_area
    noise:
      noise_db: 44.0
      noise_spread_db: 3.0
      noise_seed: 1044
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 5

  - name: Noise50
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 4
    section_type: programme_area
    noise:
      noise_db: 50.0
      noise_spread_db: 3.0
      noise_seed: 1050
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
