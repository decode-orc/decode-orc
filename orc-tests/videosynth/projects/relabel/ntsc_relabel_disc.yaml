# NTSC relabel disc: a picture that changes on every frame
#
# A 20-frame CAV disc, picture numbers 1-20, one bundled still per frame, ten
# stills of different luma structure in two orders, so that no frame's
# picture resembles another's within two frames either side. The content
# check reads an offset only where a picture differs from its neighbours'.
# relabel/ntsc_relabel_late.yaml numbers the same frames one high from
# the eleventh. No noise: the captures differ only in their numbering.

project:
  name: NtscRelabelDisc
  version: "1.0"
  description: NTSC relabel disc

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED
  ntsc_laserdisc_vbi_burst: true

output:
  video_path: "{output}/videosynth_ntsc_relabel_disc.cvbs"

line_injections:
  disc_type: CAV
  # IEC 60857 §9.1.3: NTSC and PAL-M LaserDiscs carry VIRS for colour.
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:
  - name: F01
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 1
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1

  - name: F02
    type: progressive
    source: "{bundled}/exr/720x486/VERT_LUMA_RAMP.exr"
    duration_frames: 1
    section_type: programme_area
    line_injections:
      - type: laserdisc
