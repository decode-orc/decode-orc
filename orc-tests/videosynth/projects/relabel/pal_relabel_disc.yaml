# PAL relabel disc: a picture that changes on every frame
#
# A 20-frame CAV disc, picture numbers 1-20, one bundled still per frame, ten
# stills of different luma structure in two orders, so that no frame's
# picture resembles another's within two frames either side. The content
# check reads an offset only where a picture differs from its neighbours'.
# relabel/pal_relabel_late.yaml numbers the same frames one high from
# the eleventh. No noise: the captures differ only in their numbering.

project:
  name: PalRelabelDisc
  version: "1.0"
  description: PAL relabel disc

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_pal_relabel_disc.cvbs"

line_injections:
  disc_type: CAV

sections:
  - name: F01
    type: progressive
    source: "{bundled}/exr/720x576/75_BARS.exr"
    duration_frames: 1
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1

  - name: F02
    type: progressive
    source: "{bundled}/exr/720x576/VERT_LUMA_RAMP.exr"
    duration_frames: 1
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number

