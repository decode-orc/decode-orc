# NTSC relabel disc, late numbering: its picture numbers run one high
#
# relabel/ntsc_relabel_disc.yaml with the picture numbers re-anchored one
# higher from the eleventh frame (start_value 12 there): the content is the
# same frame for frame, but from there every picture carries the number the
# next one should. Frame Map pads the number it skips, so once the captures
# are aligned by picture number, this one holds each picture one output frame
# later than the others from output frame 12 on (frame 11 is padding): the
# opposite of Countryside side 1 DS3, whose numbers run one low throughout.

project:
  name: NtscRelabelLate
  version: "1.0"
  description: NTSC relabel disc, numbered one high from frame 11

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED
  ntsc_laserdisc_vbi_burst: true

output:
  video_path: "{output}/videosynth_ntsc_relabel_late.cvbs"

line_injections:
  disc_type: CAV
  # IEC 60857 §9.1.3: NTSC and PAL-M LaserDiscs carry VIRS for colour.
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:
  - name: F01
    type: progressive
    source: "{bundled}/exr/720x486/75_BARS.exr"
    duration_frames: 1
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1

  - name: F02
    type: progressive
    source: "{bundled}/exr/720x486/VERT_LUMA_RAMP.exr"
    duration_frames: 1
    section_type: programme_area
    line_injections:
