# PAL stills for source-referenced decoder accuracy (Domesday2D investigation, Phase 1)
#
# Each still is one frame, with a different picture before and after it,
# so no decoder can find a copy of it in a neighbouring frame: the
# measurement is of a single-frame decode. Every picture is mapped onto the
# 4fsc grid with videosynth's band-limited resampler, and the project
# writes its picture truth (output.truth), the component Y, U and V that
# went into the modulator, so a decode is scored against the source rather
# than against the decoder's own Y/C split.
#
# Every section carries the capture and pressing noise of the Domesday
# model (projects/domesday/pal_domesday_A.yaml). projects/variants.json
# derives the noise-free copy (still-truth-clean) and its Y/C rendering
# (still-truth-yc). The truth is the same for all three.
#
# Test Card F, the two maps and the text card (frames 4, 7, 8 and 9) take
# videosynth's `picture_response: domesday`, the roll-off measured on the
# disc's own Test Card F (videosynth#18): the source pictures are far
# sharper than Domesday's. The photographs are already as soft as the
# disc's, and the test patterns stay sharp. The truth includes the
# response. The project has no line timing error (videosynth#19): the
# variants cannot strip a project-level block from the clean copy, so
# tools/domesday2d-bench/phase7_rotation.py --jitter writes a jittered copy
# for the Phase 10 bench instead.
#
# orc-tests/videosynth/decoders/still_truth_test.cpp names these sections
# by frame; the order here must match it.

project:
  name: PalStills
  version: "1.0"
  description: PAL single-frame stills with picture truth and the Domesday noise model

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_pal_stills.cvbs"
  truth: true

# The Domesday model's VITS: the white flag on line 19 its noise is
# measured against.
line_injections:
  vits:
    - vits_type: uk-national
      target_lines: [19]

sections:

  # Frame 0: Not measured: the picture before the first still.
  - name: Lead
    type: progressive
    source: "{bundled}/exr/720x576/100_BARS.exr"
    duration_frames: 1
    horizontal_resample: bandlimited
