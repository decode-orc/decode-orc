      # Capture layer: one play of the disc, as measured on Community
      # South's pressing A. Below 5.5 MHz the real capture noise does
      # not grow with the picture level; above it, it does, so the
      # level-dependent term is shaped to that band alone.
      noise_db: 41.9
      noise_spread_db: 1.83
      noise_seed: 1001
      spectrum:
        - [0.125, -12.5]
        - [2.625, -4.6]
        - [2.875, -1.9]
        - [3.125, -3.0]
        - [3.625, -1.2]
        - [4.625, -1.4]
        - [4.875, 0.0]
        - [6.125, -10.3]
        - [6.375, -15.2]
        - [6.625, -10.2]
        - [7.125, -32.2]
        - [7.625, -34.8]
        - [8.625, -34.5]
        - [8.857, -37.6]
      spread_spectrum:
        - [5.375, -40.0]
        - [5.625, 0.0]
        - [6.125, -4.0]
        - [6.375, -8.9]
        - [6.625, -3.9]
        - [7.125, -26.0]
        - [7.625, -28.6]
        - [8.625, -28.3]
        - [8.857, -31.4]
      # Pressing layer: the same on every capture of pressing A. Below
      # 5.5 MHz it is constant; above it, it falls as the pressing's
      # picture gets brighter: the level term.
      shared:
        noise_db: 35.8
        noise_seed: 7101
        spectrum:
          - [0.125, -11.6]
          - [0.625, -10.7]
          - [0.875, -13.8]
          - [2.125, -12.8]
          - [3.625, -6.3]
          - [5.125, -6.4]
          - [5.375, 0.0]
          - [5.5, 0.0]
          - [5.625, -40.0]
        level_term:
          noise_db: 37.8
          level_db: [[8.4, 0.0], [439.6, -8.67]]
          spectrum:
