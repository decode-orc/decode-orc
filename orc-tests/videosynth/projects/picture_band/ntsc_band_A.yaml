# NTSC picture-band pressing A: the Domesday model, its luma band-limited
#
# projects/domesday/ntsc_domesday_A.yaml with every section's picture luma
# low-passed at 3.8 MHz, so the picture ends at a known frequency and only
# noise lies above it. The pressings' shared noise layers are independent, so
# captures of the two pressings share the picture and nothing else, and their
# coherence falls to its floor where the luma ends. The cutoff lies
# inside the chroma band, which is left whole, so the measurement must
# separate luma from chroma. projects/variants.json (picture-band-captures)
# derives two captures of each pressing; they are not committed.

project:
  name: NtscBandA
  version: "1.0"
  description: NTSC picture-band pressing A

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED
  ntsc_laserdisc_vbi_burst: true

output:
  video_path: "{output}/videosynth_ntsc_band_A.cvbs"

line_injections:
  disc_type: CAV
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:

  # ---------------------------------------------------------------------------
  # PNs 1–4: 100% colour bars
  # ---------------------------------------------------------------------------
  - name: Bars
    type: progressive
    source: "{bundled}/exr/720x486/100_BARS.exr"
    duration_frames: 4
    section_type: programme_area
    luma_bandwidth:
      cutoff_mhz: 3.8
      transition_mhz: 0.4
    noise:
      # Capture layer: one play of the disc, as measured on Community
      # South's pressing A. Below 5.5 MHz the real capture noise does
      # not grow with the picture level; above it, it does, so the
      # level-dependent term is shaped to that band alone.
      noise_db: 41.9
      noise_spread_db: 1.83
      noise_seed: 1001
      spectrum:
        - [0.101, -12.5]
        - [2.119, -4.6]
        - [2.321, -1.9]
        - [2.523, -3.0]
        - [2.927, -1.2]
        - [3.734, -1.4]
        - [3.936, 0.0]
        - [4.945, -10.3]
        - [5.147, -15.2]
        - [5.349, -10.2]
        - [5.752, -32.2]
        - [6.156, -34.8]
        - [6.964, -34.5]
        - [7.149, -37.6]
      spread_spectrum:
        - [4.34, -40.0]
        - [4.541, 0.0]
        - [4.945, -4.0]
        - [5.147, -8.9]
        - [5.349, -3.9]
        - [5.752, -26.0]
        - [6.156, -28.6]
        - [6.964, -28.3]
        - [7.149, -31.4]
      # Pressing layer: the same on every capture of pressing A. Below
      # 5.5 MHz it is constant; above it, it falls as the pressing's
      # picture gets brighter: the level term.
      shared:
        noise_db: 35.8
        noise_seed: 7101
        spectrum:
          - [0.101, -11.6]
          - [0.505, -10.7]
          - [0.706, -13.8]
          - [1.716, -12.8]
          - [2.927, -6.3]
          - [4.138, -6.4]
          - [4.34, 0.0]
          - [4.441, 0.0]
          - [4.541, -40.0]
        level_term:
          noise_db: 37.8
          level_db: [[62.2, 0.0], [502.2, -8.67]]
          spectrum:
            - [4.34, -40.0]
            - [4.441, 0.0]
            - [4.541, 0.0]
            - [4.945, -2.9]
            - [5.349, -11.3]
            - [5.551, -20.9]
            - [5.752, -25.0]
            - [5.954, -34.6]
            - [6.156, -39.4]
            - [7.149, -40.0]
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: programme_status
            programme_status: "0x8DC001"

