        - [2.625, -4.6]
        - [2.875, -1.9]
        - [3.125, -3.0]
        - [3.625, -1.2]
        - [4.625, -1.4]
        - [4.875, 0.0]
        - [6.125, -10.3]
        - [6.375, -15.2]
        - [6.625, -10.2]
        - [7.125, -32.2]
        - [7.625, -34.8]
        - [8.625, -34.5]
        - [8.857, -37.6]
      spread_spectrum:
        - [5.375, -40.0]
        - [5.625, 0.0]
        - [6.125, -4.0]
        - [6.375, -8.9]
        - [6.625, -3.9]
        - [7.125, -26.0]
        - [7.625, -28.6]
        - [8.625, -28.3]
        - [8.857, -31.4]

  # An Ordnance Survey town map: lettering and fine lines
