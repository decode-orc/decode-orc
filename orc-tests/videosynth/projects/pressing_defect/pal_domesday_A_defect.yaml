            - [6.625, -11.3]
            - [6.875, -20.9]
            - [7.125, -25.0]
            - [7.375, -34.6]
            - [7.625, -39.4]
            - [8.857, -40.0]
    # Stamper defects: on every capture of this pressing (anchored to the
